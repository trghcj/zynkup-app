name: Backend Tests

on:
  push:
    branches: [ "main", "dev/divyansh" ]
    paths: [ "zynkup_backend/**", ".github/workflows/backend.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "zynkup_backend/**", ".github/workflows/backend.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ sqlite, postgres ]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zynkup
          POSTGRES_PASSWORD: zynkup
          POSTGRES_DB: zynkup_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U zynkup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: zynkup_backend

    steps:
      - uses: actions/checkout@v4

      # Same Python as the Dockerfile Render builds from.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zynkup_backend/requirements.txt

      # Fresh install from requirements.txt, exactly like the Render build, so
      # dependency drift (e.g. SQLAlchemy 2.1 switching the default Postgres
      # driver) fails here instead of in production.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import app with a Render-style DATABASE_URL
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgres://zynkup:zynkup@localhost:5432/zynkup_test
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
        run: python -c "import app.main; print('app imported OK')"

      - name: Run unit + integration tests
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://zynkup:zynkup@localhost:5432/zynkup_test' || '' }}
        run: python -m unittest discover -s tests -t . -v
