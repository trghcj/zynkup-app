<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Zynkup — MAIT College Events App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-signin-client_id" 
        content="659234851207-o80f3633j9f09j79d0ml7376o7v4iv58.apps.googleusercontent.com">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6a1b9a">

  <title>Zynkup</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>
  <link rel="manifest" href="manifest.json">

  <!-- 🔥 FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, setPersistence, browserSessionPersistence } 
      from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCg7ZsRbg0o5HJ7S5LVEwNQaYciEl-hmEY",
      authDomain: "zynkup-app.firebaseapp.com",
      projectId: "zynkup-app",
      storageBucket: "zynkup-app.firebasestorage.app",
      messagingSenderId: "659234851207",
      appId: "1:659234851207:web:39cc56f3416de5bc43eb22"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserSessionPersistence)
      .then(() => console.log("Firebase Auth ready"))
      .catch(err => console.error(err));
  <style>
    #app-launcher-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999999;
      background: #0B0F17;
      color: #FFFFFF;
      padding: 10px 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #app-launcher-banner.active {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .launcher-btn {
      background: #84CC16;
      color: #000000;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && (path.indexOf('/events/') === 0 || path.indexOf('/feed/') === 0 || path.indexOf('/posts/') === 0)) {
        var target = path.substring(1);
        var schemeUrl = 'zynkup://' + target;
        var intentUrl = 'intent://' + target + '#Intent;scheme=zynkup;package=com.example.zynkup;S.browser_fallback_url=' + encodeURIComponent(window.location.href) + ';end;';
        
        window.addEventListener('DOMContentLoaded', function() {
          var banner = document.getElementById('app-launcher-banner');
          var btn = document.getElementById('launcher-link');
          if (banner && btn) {
            banner.className = 'active';
            btn.href = intentUrl;
            btn.onclick = function() {
              window.location.href = intentUrl;
              setTimeout(function() { window.location.href = schemeUrl; }, 250);
            };
          }
        });

        setTimeout(function() {
          try {
            window.location.href = intentUrl;
          } catch(e) {}
        }, 150);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
  <div id="app-launcher-banner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="favicon.png" width="28" height="28" style="border-radius: 6px;">
      <div>
        <div style="font-weight: 700; font-size: 13px;">Zynkup</div>
        <div style="font-size: 11px; opacity: 0.7;">Open in App for full experience</div>
      </div>
    </div>
    <a id="launcher-link" href="#" class="launcher-btn">Open App</a>
  </div>
</body>
</html>
